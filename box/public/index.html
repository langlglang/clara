<!doctype html>
<!-- Clara box screen (800x480 kiosk), Field Kit theme (docs/design/field-kit.md). Plain HTML/CSS/JS, no build step. The server fills in the token. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800, height=480, initial-scale=1">
<meta name="screen-token" content="__SCREEN_TOKEN__">
<title>Clara box</title>
<link rel="stylesheet" href="/screen/assets/style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <span id="brand">CLARA</span>
    <span id="voice-state" class="tag off" role="status" aria-live="polite">MIC OFF</span>
    <button data-action="set_language" id="lang-button" class="small lang" hidden></button>
    <span id="status" class="tag status"><i class="dot"></i><span id="status-text">ONLINE</span></span>
    <span id="tag-link" class="tag lost" hidden><i class="dot"></i>SCREEN LOST THE BOX SERVICE</span>
  </header>

  <div id="banners">
    <div id="coming" class="banner coming" hidden><i class="dot"></i><span id="coming-text"></span></div>
    <div id="nearby-banner" class="banner coming" hidden><i class="dot"></i><span id="nearby-banner-text"></span><button data-action="dismiss_nearby" id="nearby-done" class="small" data-i18n>DONE</button></div>
    <div id="notice" class="banner notice" hidden><span id="notice-text"></span></div>
  </div>

  <main id="main">
    <section id="idle" hidden>
      <div class="lbl">VOICE ASSISTANCE</div>
      <h1>Clara</h1>
      <p id="idle-instruction">Open the lid to speak with Clara.</p>
      <div id="idle-activity" class="voice-activity off" hidden><span class="activity-dot" aria-hidden="true"></span><span id="activity-text"></span></div>
      <div id="idle-caption"></div>
    </section>

    <section id="presentation" aria-live="polite" hidden>
      <div id="words">
        <div id="visual-title" class="lbl"></div>
        <div id="visual-body"></div>
        <div id="item" hidden>
          <span id="slot"></span>
          <span id="item-text"></span>
          <span id="item-state"></span>
        </div>
        <div id="caption"></div>
        <div id="visual-source" class="lbl"></div>
      </div>
      <div id="picture"><img id="visual-image" alt=""><video id="visual-video" muted loop playsinline autoplay disablepictureinpicture hidden></video><div id="no-image">NO PICTURE</div>
        <div id="coach" hidden><div id="coach-ring"><span id="coach-count">0</span><small>PUSHES</small></div><div id="coach-bpm" class="lbl"></div><button data-action="stop_coach" class="small" data-i18n>STOP CPR COACH</button></div>
      </div>
    </section>
  </main>

  <aside id="rail">
    <button data-action="sos" id="sos-button" class="sos">SOS<small data-i18n>CALL FOR HELP</small></button>
    <button data-action="mute" id="mute-button" class="mute" aria-pressed="false">MUTE CLARA</button>
    <div id="tiles"></div>
  </aside>

  <div id="pulse-prompt" class="overlay danger" hidden>
    <div class="card center">
      <h2 data-i18n>NO PULSE DETECTED BY THE SENSOR</h2>
      <p data-i18n>Is the person responding? Are they breathing normally?</p>
      <div class="row"><button data-action="pulse_not_breathing" class="big cancel" data-i18n>NOT BREATHING</button><button data-action="pulse_breathing" class="big" data-i18n>BREATHING</button></div>
    </div>
  </div>

  <div id="nearby" class="overlay danger" hidden>
    <div class="card center">
      <div class="lbl" data-i18n>NEARBY EMERGENCY</div>
      <h2 id="nearby-title"></h2>
      <p id="nearby-directions"></p>
      <div class="row"><button data-action="dismiss_nearby" id="nearby-dismiss" class="big" data-i18n>DISMISS</button><button data-action="bringing_kit" id="nearby-bring" class="big primary" data-i18n>I'M BRINGING IT</button></div>
    </div>
  </div>

  <div id="sleep" role="button" tabindex="0" aria-label="Wake Clara screen"></div>

</div>
<script src="/screen/assets/app.js"></script>
</body>
</html>
