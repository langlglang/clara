<!doctype html>
<!-- Clara box screen (800x480 kiosk), Field Kit theme (docs/design/field-kit.md). Plain HTML/CSS/JS, no build step. The server fills in the token. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800, height=480, initial-scale=1">
<meta name="screen-token" content="__SCREEN_TOKEN__">
<title>Clara box</title>
<link rel="stylesheet" href="/screen/assets/style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <span id="brand">CLARA DEMO</span>
    <span id="box-name"></span>
    <span id="tag-sim" class="tag sim" hidden>SIMULATION</span>
    <span id="voice-state" class="tag off" role="status" aria-live="polite">MIC OFF</span>
    <span id="status" class="tag status"><i class="dot"></i><span id="status-text">ONLINE</span></span>
    <span id="tag-link" class="tag lost" hidden><i class="dot"></i>SCREEN LOST THE BOX SERVICE</span>
  </header>

  <div id="banners">
    <div id="coming" class="banner coming" hidden><i class="dot"></i><span id="coming-text"></span></div>
    <div id="nearby-banner" class="banner nearby" hidden><b>EMERGENCY NEARBY</b><span id="nearby-banner-text"></span></div>
    <div id="notice" class="banner notice" hidden><span id="notice-text"></span></div>
  </div>

  <main id="main">
    <section id="idle" hidden>
      <div class="lbl">CLARA DEMO</div>
      <h1>Clara</h1>
      <p id="idle-instruction">Open the lid to speak with Clara.</p>
      <div id="idle-activity" class="voice-activity off" hidden><span class="activity-dot" aria-hidden="true"></span><span id="activity-text"></span></div>
      <div id="idle-caption"></div>
    </section>

    <section id="presentation" aria-live="polite" hidden>
      <div id="words">
        <div id="visual-title" class="lbl"></div>
        <div id="visual-body"></div>
        <div id="item" hidden>
          <span id="slot"></span>
          <span id="item-text"></span>
          <span id="item-state"></span>
        </div>
        <div id="caption"></div>
        <div id="visual-source" class="lbl"></div>
      </div>
      <div id="picture"><img id="visual-image" alt=""><div id="no-image">NO PICTURE</div></div>
    </section>
  </main>

  <aside id="rail">
    <button data-action="sos" id="sos-button" class="sos">SOS<small>SIMULATED 911</small></button>
    <div id="tiles"></div>
  </aside>

  <div id="countdown" class="overlay danger" hidden>
    <div class="card center">
      <div class="sim-strip">SIMULATION · NO REAL CALL IS MADE</div>
      <h2>OPENING MOCK 911 CALL IN</h2>
      <div id="countdown-number">5</div>
      <button data-action="cancel_sos" class="big cancel">CANCEL</button>
    </div>
  </div>

  <div id="call" class="overlay call" hidden>
    <div class="card">
      <div class="sim-strip">SIMULATION · NO REAL CALL IS MADE</div>
      <div class="call-head"><h2>MOCK 911 CALL</h2><span id="call-time"></span></div>
      <div class="lbl">WHAT TO SAY</div>
      <ol id="coaching"></ol>
      <div id="call-network"></div>
      <div id="call-coming"></div>
      <div class="row"><button data-action="hide_911" class="strong">BACK TO CLARA</button></div>
    </div>
  </div>

</div>
<script src="/screen/assets/app.js"></script>
</body>
</html>
