# Adapted from Sophi (github.com/mzhao1599/sophi), devices/pi/systemd/steady-walker.service.d/10-volume.conf.
# Sets the soundbar to 75% each time the box service starts. The leading "-" means a missing card (speaker
# unplugged, or a control not called PCM: see `amixer -c Speaker scontrols`) doesn't stop the service.
[Service]
ExecStartPre=-/usr/bin/amixer -q -c Speaker sset PCM 75% unmute
