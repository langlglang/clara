<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
<title id="title">Clara three-slot tray: bottom compartment</title>
<desc id="desc">Top-left small compartment, top-right medium compartment, bottom large compartment. The selected compartment is bright yellow.</desc>
<rect width="480" height="320" fill="#1f1f23"/>
<text x="28" y="23" fill="#d8d8d8" font-family="sans-serif" font-size="15">BOX LAYOUT · LID AT TOP</text>
<rect x="28" y="38" width="162" height="102" rx="8" fill="#303036" stroke="#77777d" stroke-width="3"/>
<text x="44" y="83" fill="#eeeeee" font-family="sans-serif" font-size="22" font-weight="700">TOP LEFT</text>
<text x="44" y="111" fill="#eeeeee" font-family="sans-serif" font-size="15">SMALL SLOT</text>
<rect x="208" y="38" width="244" height="102" rx="8" fill="#303036" stroke="#77777d" stroke-width="3"/>
<text x="224" y="83" fill="#eeeeee" font-family="sans-serif" font-size="22" font-weight="700">TOP RIGHT</text>
<text x="224" y="111" fill="#eeeeee" font-family="sans-serif" font-size="15">MEDIUM SLOT</text>
<rect x="28" y="160" width="424" height="130" rx="8" fill="#d9f45b" stroke="#d9f45b" stroke-width="3"/>
<text x="44" y="205" fill="#141414" font-family="sans-serif" font-size="22" font-weight="700">BOTTOM</text>
<text x="44" y="233" fill="#141414" font-family="sans-serif" font-size="15">LARGE SLOT</text>
</svg>
