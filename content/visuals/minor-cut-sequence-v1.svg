<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
<title id="title">Rinse and cover a superficial cut or scrape</title>
<desc id="desc">Two source-linked panels: if running tap water or sterile saline is available, rinse a superficial cut or scrape until no visible debris remains; once clean, cover with an adhesive bandage. The box does not supply water or saline. This does not apply to heavy bleeding, deep wounds, or bites.</desc>
<rect width="800" height="520" fill="#1f1f23"/>
<text x="36" y="48" fill="#f5f5f5" font-family="sans-serif" font-size="29" font-weight="700">SUPERFICIAL CUT OR SCRAPE</text>
<rect x="34" y="72" width="349" height="366" rx="18" fill="#303036" stroke="#75c9e0" stroke-width="5"/>
<rect x="417" y="72" width="349" height="366" rx="18" fill="#303036" stroke="#d9f45b" stroke-width="5"/>
<circle cx="85" cy="122" r="27" fill="#75c9e0"/><text x="77" y="132" fill="#16252a" font-family="sans-serif" font-size="28" font-weight="700">1</text>
<circle cx="468" cy="122" r="27" fill="#d9f45b"/><text x="460" y="132" fill="#1f1f23" font-family="sans-serif" font-size="28" font-weight="700">2</text>
<text x="128" y="131" fill="#f4f4f4" font-family="sans-serif" font-size="31" font-weight="700">RINSE</text>
<text x="511" y="131" fill="#f4f4f4" font-family="sans-serif" font-size="31" font-weight="700">COVER</text>
<path d="M116 182h100v28h-32v43h-43v-43h-25z" fill="#c9d4d6" stroke="#f0f4f4" stroke-width="5"/>
<path d="M163 252q-18 29-18 51a18 18 0 0 0 36 0q0-22-18-51zM209 259q-13 23-13 40a13 13 0 0 0 26 0q0-17-13-40z" fill="#75c9e0"/>
<path d="M257 344q39-25 67 0" fill="none" stroke="#f3c6b1" stroke-width="32" stroke-linecap="round"/>
<path d="M267 333l42 13" fill="none" stroke="#b94754" stroke-width="4" stroke-linecap="round"/>
<rect x="474" y="235" width="234" height="84" rx="42" fill="#d1aa80" stroke="#f0d0aa" stroke-width="6"/>
<rect x="566" y="244" width="53" height="66" rx="9" fill="#f6f4ec"/>
<g fill="#9f7958"><circle cx="515" cy="262" r="5"/><circle cx="541" cy="262" r="5"/><circle cx="515" cy="293" r="5"/><circle cx="541" cy="293" r="5"/><circle cx="643" cy="262" r="5"/><circle cx="669" cy="262" r="5"/><circle cx="643" cy="293" r="5"/><circle cx="669" cy="293" r="5"/></g>
<text x="56" y="378" fill="#f4f4f4" font-family="sans-serif" font-size="20">If available: running tap</text>
<text x="56" y="406" fill="#f4f4f4" font-family="sans-serif" font-size="20">water or sterile saline</text>
<text x="439" y="378" fill="#f4f4f4" font-family="sans-serif" font-size="20">Once clean: cover with</text>
<text x="439" y="406" fill="#f4f4f4" font-family="sans-serif" font-size="20">an adhesive bandage</text>
<text x="36" y="478" fill="#bfc0c4" font-family="sans-serif" font-size="18">AHA / RED CROSS 2024 · NOT FOR HEAVY BLEEDING, DEEP WOUNDS OR BITES</text>
</svg>
