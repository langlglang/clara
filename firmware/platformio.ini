; Adapted from Sophi (github.com/mzhao1599/sophi), firmware/platformio.ini.
; Clara's ESP32-WROOM-32 firmware: lid and wall-mount switches, one LED per kit compartment, the all-LED rhythm,
; a buzzer and the MAX30102 pulse sensor, speaking newline JSON to the Pi (packages/contracts/src/serial.ts).
;   pio run -e esp32 -t upload && pio device monitor -b 115200
;   pio test -e native          (the board-independent logic in lib/clara, on your computer)
; Not built yet: PlatformIO was not installed when this was written. Pins are placeholders (see README.md).

[platformio]
default_envs = esp32

[env:esp32]
; espressif32 6.12.0 bundles the Arduino-ESP32 core 2.0.17 (the ledcSetup/ledcAttachPin API used in main.cpp).
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; The core builds C++ as gnu++11; lib/clara needs C++17.
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D CLARA_LED_COUNT=6
  -D CLARA_LED_REQUIRE_LID_OPEN=1
  -D CLARA_MOUNT_SWITCH=1
  -D CLARA_BUZZER_PASSIVE=0
build_src_flags = -Wall -Wextra
lib_deps =
  bblanchon/ArduinoJson@7.2.1
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2
test_ignore = *

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
