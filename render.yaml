# Render Blueprint for Clara's web app (apps/web): box API, companion app, consoles, kit map, scene report.
# Pattern from Sophi's render.yaml (github.com/mzhao1599/sophi). Field reference: https://render.com/docs/blueprint-spec
# Secrets are never written here: the keys below are `sync: false`, so Render asks for them in the dashboard.
services:
  - type: web
    name: clara
    runtime: node
    # Free: spins down after 15 minutes with no requests (first request after that waits about a minute).
    # A connected box's heartbeat keeps it up. State lives in memory and is snapshotted to the clara-db Postgres
    # below (docs/persistence.md), so a restart, redeploy or spin-down picks up where it left off.
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build -w @clara/web
    startCommand: cd apps/web && ../../node_modules/.bin/next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/state
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Snapshot persistence (apps/web/lib/persist.ts). Internal connection string: private network only.
      - key: DATABASE_URL
        fromDatabase:
          name: clara-db
          property: connectionString
      # Next leaves SIGTERM to the app, which saves one last snapshot and then exits.
      - key: NEXT_MANUAL_SIG_HANDLE
        value: "true"
      # Claude (voice turns) and Cartesia (speech-to-text and voice). Entered in the dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      # Shared Pi credential required for one-frame camera interpretation; set the same secret on the Pi.
      - key: CLARA_BOX_TOKEN
        sync: false
      # Without an Anthropic key the voice brain uses the keyword stub; with one, Claude answers.
      - key: CLARA_MODEL
        value: stub
      - key: CLARA_TURN_BUDGET_MS
        value: "6500"
      # Demo boxes with a simulated heartbeat. Remove a box's id once its real Pi is connected.
      - key: CLARA_SIMULATED_BOXES
        value: box-clinic,box-water-point
      - key: CLARA_AMBULANCE_ETA_MIN
        value: "35"
      # Response coordinator (deepagents): "on" runs the deep agent when ANTHROPIC_API_KEY is set (off without it),
      # "rules" runs the no-key planner, "off" disables it. Model defaults to claude-opus-5-5.
      - key: CLARA_COORDINATOR
        value: "on"
      - key: CLARA_COORDINATOR_MODEL
        sync: false
      # Optional LangSmith tracing: set LANGSMITH_TRACING=true and the key in the dashboard.
      - key: LANGSMITH_TRACING
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      # Web push (companion PWA). Set a fixed VAPID pair so subscriptions survive restarts; without it the server
      # generates one at start and keeps it in the database snapshot. Generate with: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Phone-call fallback (Twilio). Without all three, calls are only logged ("would call ...").
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Demo "911": the team's demo dispatcher phone that Twilio rings when an SOS opens (never a real emergency number).
      - key: CLARA_DEMO_911_NUMBER
        sync: false
      # Origin Twilio calls back on; its request signatures are checked against this.
      - key: PUBLIC_BASE_URL
        value: https://clara.living
      # Text alerts over Photon (photon.codes Beta API). Without key + project id, texts are only logged ("would message ...").
      - key: PHOTON_API_KEY
        sync: false
      - key: PHOTON_PROJECT_ID
        value: pho_prj_01m7cbytt4fahstv8xerqw8w8z
      # whsec_... printed by `npx tsx scripts/photon-setup.ts --webhook`; inbound replies are refused without it.
      - key: PHOTON_WEBHOOK_SECRET
        sync: false

databases:
  # Snapshot store for the web service (one row, table clara_snapshot, created by the app).
  # Note: Render's free Postgres expires 30 days after creation (with a grace period to upgrade); after that,
  # create a new one (or upgrade) and the app starts fresh with the demo seed.
  - name: clara-db
    plan: free
    region: virginia
    databaseName: clara
    user: clara
    # No entries: reachable only from Render services in the same region over the private network.
    ipAllowList: []
